<span class="bag-chip swatch-picker" id="cat-chip-{{ cat.pk }}">
  <span class="bag-chip-name">{{ cat.name }}</span>
  {% for swatch in swatches %}
  <button class="color-dot swatch-{{ swatch }}" type="button" title="{{ swatch }}"
          hx-post="{% url 'category_set_color' cat.pk %}{% if cat_trip %}?trip={{ cat_trip.pk }}{% elif cat_template %}?template={{ cat_template.pk }}{% endif %}"
          hx-vals='{"color": "{{ swatch }}"}'
          hx-target="#cat-chip-{{ cat.pk }}" hx-swap="outerHTML"></button>
  {% endfor %}
  <button class="linkbtn" type="button" title="Cancel"
          hx-get="{% url 'category_chip' cat.pk %}{% if cat_trip %}?trip={{ cat_trip.pk }}{% elif cat_template %}?template={{ cat_template.pk }}{% endif %}"
          hx-target="#cat-chip-{{ cat.pk }}" hx-swap="outerHTML">Cancel</button>
</span>
