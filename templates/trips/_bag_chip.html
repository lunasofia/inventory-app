<span class="bag-chip swatch-{{ bag.color }}" id="bag-chip-{{ bag.pk }}">
  <span class="bag-chip-name">{{ bag.name }}</span>
  {% if can_edit %}
    <button class="linkbtn" type="button" title="Change color"
            hx-get="{% url 'bag_set_color' trip.pk bag.pk %}"
            hx-target="#bag-chip-{{ bag.pk }}" hx-swap="outerHTML">&#9632;</button>
    <button class="linkbtn" type="button" title="Rename"
            hx-get="{% url 'bag_edit' trip.pk bag.pk %}"
            hx-target="#bag-chip-{{ bag.pk }}" hx-swap="outerHTML">&#9998;</button>
    <button class="linkbtn danger" type="button" title="Delete"
            hx-post="{% url 'bag_delete' trip.pk bag.pk %}"
            hx-target="#planning" hx-swap="outerHTML"
            hx-confirm="Delete &quot;{{ bag.name }}&quot;? Its items become Unbagged.">&#10005;</button>
  {% endif %}
</span>
